name: Central N2 Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: central_n2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller
      - name: Compile
        run: python -m compileall .
      - name: Tests
        run: python -m pytest -q
      - name: Build portable
        run: pyinstaller CentralN2.spec
      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path dist\CentralN2\* -DestinationPath dist\CentralN2-win64.zip -Force
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\CentralN2.iss'
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\CentralN2-win64.zip installer\Output\CentralN2-Setup.exe --generate-notes --title "Central N2 $env:GITHUB_REF_NAME"
