name: Central N2 Tests

on:
  push:
    paths:
      - 'central_n2/**'
      - '.github/workflows/central-n2-tests.yml'
  pull_request:
    paths:
      - 'central_n2/**'
      - '.github/workflows/central-n2-tests.yml'

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    defaults:
      run:
        working-directory: central_n2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: central_n2/requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile with SyntaxWarning as error
        run: python -W error::SyntaxWarning -m compileall -q .

      - name: Ruff correctness checks
        if: matrix.python-version == '3.12'
        run: >-
          python -m ruff check
          main.py
          core/actions.py core/baselines.py core/config.py
          core/connectivity.py core/context.py core/evaluation.py
          core/executor.py core/jobs.py core/logger.py core/result.py
          core/session.py core/transport core/updater.py core/validation.py
          diagnostics execution playbooks remediation reports storage validation
          integrations/glpi/client.py
          ui/console_base.py ui/console_v5.py ui/tk_app.py
          modules/health.py modules/compliance.py modules/performance.py
          modules/updates.py modules/disk.py modules/glpi.py
          modules/network.py modules/printers.py modules/system.py
          modules/domain.py modules/devices.py modules/software.py
          modules/users_profiles.py modules/workstation_tools.py
          modules/repair.py modules/packages.py modules/certificates.py
          modules/registry_actions.py modules/file_ops.py
          --select E4,E7,E9,F

      - name: Mypy hardened contracts
        if: matrix.python-version == '3.12'
        run: >-
          python -m mypy --explicit-package-bases
          core/result.py core/context.py core/actions.py
          core/evaluation.py core/updater.py core/validation.py
          execution/models.py execution/policy.py execution/config_validation.py
          execution/registry.py execution/engine.py
          remediation/engine.py
          validation/models.py validation/config.py validation/reporting.py
          validation/runner.py validation/cli.py

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: python -m pytest -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: >-
          python -m pytest -q
          --cov=core --cov=diagnostics --cov=playbooks
          --cov=execution --cov=remediation --cov=reports --cov=storage --cov=validation
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=40

      - name: Enforce validator coverage
        if: matrix.python-version == '3.12'
        run: python tests/check_validator_coverage.py coverage.json

      - name: Field validation smoke - SAFE
        if: matrix.python-version == '3.12'
        run: >-
          python -m validation.cli
          --matrix config/endpoint_matrix.ci.json
          --output-dir reports/field-validation-ci-safe

      - name: Field validation smoke - CONTROLLED LOW
        if: matrix.python-version == '3.12'
        run: >-
          python -m validation.cli
          --matrix config/endpoint_matrix.ci.json
          --output-dir reports/field-validation-ci-controlled
          --allow-mutations
          --acknowledge "VALIDAR ENDPOINTS 5.2"

  build:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: central_n2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: central_n2/requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build portable smoke
        run: pyinstaller CentralN2.spec --clean --noconfirm

      - name: Install pinned Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build installer smoke
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\CentralN2.iss'
